<svg xmlns="http://www.w3.org/2000/svg" width="900" height="608" viewBox="0 0 900 608" role="img" aria-label="Timeline of my upstream pull requests"><title>Timeline of my upstream pull requests</title><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1f2a40" stroke-width=".5" opacity=".45"/></pattern>
